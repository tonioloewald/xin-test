<title>xin-test</title>
<h1>xin-test</h1>
<p>
  <a target="_blank" href="https://github.com/tonioloewald/xin-test">github</a>
  |
  <a target="_blank" href="https://www.npmjs.com/package/xin-test-component"
    >npmjs</a
  >
</p>
<p>
  This is a simple component that runs tests in the browser and shows the
  result.
</p>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap');
  body {
    font-family: 'Roboto Slab', serif;
    font-optical-sizing: auto;
    font-weight: <weight>;
    font-style: normal;
  }
</style>
<hr />
<h2>HTML Tests (code inline)</h2>
<element-demo description="simple success"> return true </element-demo>
<element-demo description="simple failure"> return false </element-demo>
<element-demo description="1 + 1" expect="2"> return 1 + 1 </element-demo>
<element-demo description="json comparison (string)" expect='"hello, test"'>
  return 'hello, test'
</element-demo>
<element-demo description="json comparison (object)" expect='{"foo":"bar"}'>
  return {foo: 'bar'}
</element-demo>
<element-demo description="succeeds after 5s" delay="5000">
  return true
</element-demo>
<element-demo description="throws exception">
  throw new Error('ruh roh')
</element-demo>
<hr />
<h2>Code Tests (test inserted by code)</h2>

<script type="module">
  const { makeComponent, elements } = await import(
    'https://cdn.jsdelivr.net/npm/xinjs@0.8.8/dist/module.js'
  )

  const { elementDemo } = elements

  const blueprint = (await import('./dist/blueprint.js')).default
  const { creator, type } = await makeComponent('element-demo', blueprint)
  document.body.append(
    elementDemo({
      description: 'immediate success (number)',
      async test() {
        return 42
      },
      expect: '42',
    }),
    elementDemo({
      description: 'immediate success (string)',
      async test() {
        return 'this is a test'
      },
      expect: '"this is a test"',
    }),
    elementDemo({
      description: 'immediate success (array)',
      async test() {
        return [1, 2, '3']
      },
      expect: '[1,2,"3"]',
    }),
    creator({
      delay: 2000,
      description: 'success from code after 2s delay',
      async test() {
        return 17
      },
      expect: '17',
    }),
    creator({
      delay: 2000,
      description: 'success from code after 2s delay and 2s running',
      async test() {
        await type.delay(2000)
        return 17
      },
      expect: '17',
    })
  )
</script>
